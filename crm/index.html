<title>Bjelobrkovic Kids CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<!--
  Foto CRM — CRM za dječiju i porodičnu fotografkinju.
  Ovaj fajl ne sadrži podatke o klijentima. Na claude.ai podaci su u privatnoj bazi
  artefakta (capability "db"); otvoren kao lokalni fajl, čuva ih u localStorage.
-->
<style>
:root{
  --bg:#faf6f5; --surface:#ffffff; --ink:#2d2426; --muted:#7b6c6f; --line:#eadfdf;
  --accent:#a8566a; --accent-ink:#ffffff; --accent-soft:#f5e6ea;
  --red:#b3261e; --red-soft:#fbe4e1; --orange:#945600; --orange-soft:#fcefd8;
  --green:#2c7a4b; --green-soft:#e0f1e6; --grey-soft:#f3eeee;
  --shadow:0 12px 40px rgba(60,30,40,.18); --overlay:rgba(45,30,35,.45);
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1c1718; --surface:#262022; --ink:#f1e9ea; --muted:#b3a3a6; --line:#3a3134;
    --accent:#e08ea2; --accent-ink:#1c1718; --accent-soft:#43292f;
    --red:#f08a80; --red-soft:#4a2522; --orange:#f0b35c; --orange-soft:#43321a;
    --green:#7fd3a0; --green-soft:#1f3a2a; --grey-soft:#2f2729;
    --shadow:0 12px 40px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1c1718; --surface:#262022; --ink:#f1e9ea; --muted:#b3a3a6; --line:#3a3134;
  --accent:#e08ea2; --accent-ink:#1c1718; --accent-soft:#43292f;
  --red:#f08a80; --red-soft:#4a2522; --orange:#f0b35c; --orange-soft:#43321a;
  --green:#7fd3a0; --green-soft:#1f3a2a; --grey-soft:#2f2729;
  --shadow:0 12px 40px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 16px;padding-block:10px;padding-inline:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:21px;white-space:nowrap;line-height:1.1}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.02em}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;padding:7px 11px;border-radius:8px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;text-align:center;margin-left:5px;font-variant-numeric:tabular-nums}
.badge.red{background:var(--red);color:var(--surface)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--red);font-weight:600}
main{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-inline:16px}
h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:4px 0 4px;text-wrap:balance}
h2{font-size:16px;font-weight:700;margin:26px 0 8px;text-wrap:balance}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:75ch}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.small{padding:3px 9px;font-size:13px}
button.danger{color:var(--red)}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;text-align:left}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--grey-soft);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--grey-soft)}
tr.hot td{background:var(--orange-soft)}
tr.late td{background:var(--red-soft)}
tr.done td{color:var(--muted);background:var(--grey-soft)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--grey-soft);color:var(--muted);margin:1px 2px 1px 0;white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.orange{background:var(--orange-soft);color:var(--orange)}
tr.late .tag,tr.hot .tag{background:var(--surface)}
.muted{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar input,.toolbar select{width:auto;max-width:100%}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input:disabled{background:var(--grey-soft);color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 10px}
label>input,label>select,label>textarea{margin-top:3px;color:var(--ink);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.checks{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:14px}
.checks label,.inline{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
.checks input,.inline input{width:auto;margin:0}
.inline{align-self:end;padding-bottom:10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chips label{margin:0;position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer;user-select:none}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips input:focus-visible+span{outline:2px solid var(--accent)}
.fieldtitle{font-size:13px;color:var(--muted);margin:0}
.modal{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:20}
.modal.top{z-index:40;align-items:center}
.box{background:var(--surface);border-radius:14px;max-width:760px;width:100%;padding:20px 22px;box-shadow:var(--shadow)}
.box.narrow{max-width:440px}
.box h2{margin-top:0;font-family:var(--serif);font-weight:400;font-size:24px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.section{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.banner{max-width:1180px;margin:12px auto 0;padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bannerwrap{padding-inline:16px}
.banner.warn{background:var(--orange-soft)}
.banner.err{background:var(--red-soft)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:150px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.match{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px;align-items:center}
.match button{font-size:13px;padding:4px 10px;background:var(--accent-soft);border-color:var(--accent-soft)}
.picked{background:var(--accent-soft);padding:8px 12px;border-radius:8px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:20px;z-index:50;font-size:14px;max-width:calc(100% - 32px)}
.toast.err{background:var(--red);color:var(--surface)}
.pre{white-space:pre-wrap}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:760px){.grid2,.grid3,.cols{grid-template-columns:1fr} .brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="brand">Foto CRM<small>@bjelobrkovic_kids</small></div>
  <nav id="nav"></nav>
  <span class="sync" id="sync"></span>
  <button class="primary" id="btnNew" type="button" title="Prečica: N">+ Novi upit</button>
</header>
<div id="banner" class="bannerwrap"></div>
<main id="main"><div class="loading">Učitavanje podataka…</div></main>
<div id="modal" class="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="confirm" class="modal top" hidden><div class="box narrow"><p id="confirmMsg" class="pre"></p><div class="actions"><button type="button" id="confirmNo">Odustani</button><button type="button" class="primary" id="confirmYes">Da</button></div></div></div>

<script>
'use strict';

/* ---------- Konstante ---------- */
const LOCAL_KEY = 'fotoCrm.v1';
const COLS = { clients: 'klijenti', children: 'djeca', shoots: 'fotosesije' };
const IZVORI = ['Lični Instagram', 'Instagram studija', 'Telegram «Родители и дети Бар»', 'Targetirana reklama', 'Preporuka', 'Google', 'Sajt', 'Drugo'];
const VRSTE = ['Trudnička', 'Novorođenče', 'Beba do godine', 'Prvi rođendan', 'Starija djeca', 'Porodična', 'Događaj', 'Projekat'];
const PROJEKTI = ['Lubenica', 'Đaci prvaci', 'Mama i ja', 'Bake i unuci', 'Novogodišnji', '8. mart', 'Uskrs'];
const STATUSI = ['Upit', 'Dogovoreno', 'Avans', 'Snimljeno', 'Fotografije izabrane', 'Predato', 'Recenzija', 'Ponovni klijent', 'Otkazano'];
const ZAVRSENO = ['Predato', 'Recenzija', 'Ponovni klijent', 'Otkazano'];
const JEZICI = ['Ruski', 'Crnogorski / srpski', 'Engleski', 'Drugi'];
const KNJIGE = { Classic: 70, Standard: 100, Premium: 130, Deluxe: 150 };
const GRAVIRANJE = 5;
const ROK_DANA = 14;          // radnih dana
const PODSJETNIK_DANA = 42;   // 6 sedmica
const MJESECI = ['januar', 'februar', 'mart', 'april', 'maj', 'jun', 'jul', 'avgust', 'septembar', 'oktobar', 'novembar', 'decembar'];
const TABS = [['rodjendani', 'Rođendani'], ['rokovi', 'Rokovi'], ['klijenti', 'Klijenti'], ['fotosesije', 'Fotosesije'], ['statistika', 'Statistika'], ['kopija', 'Rezervna kopija']];

/* ---------- Stanje ---------- */
let mode = 'loading';      // 'cloud' (baza na claude.ai) | 'local' (localStorage)
let loaded = false;
let store = null, downloads = null;
let db = empty();
let tab = 'rodjendani';
const ui = { q: '', fStatus: '', fVrsta: '', fGod: '', statGod: String(new Date().getFullYear()) };
const synced = { clients: {}, children: {}, shoots: {}, meta: '' };
const docChains = {};
let pendingWrites = 0, writeError = '';

function empty() {
  return { clients: [], children: [], shoots: [], projekti: PROJEKTI.slice(), bdayDone: {}, lastBackup: null, changes: 0 };
}
function metaOf(d) {
  return {
    projekti: Array.isArray(d.projekti) && d.projekti.length ? d.projekti : PROJEKTI.slice(),
    bdayDone: d.bdayDone && typeof d.bdayDone === 'object' ? d.bdayDone : {},
    lastBackup: d.lastBackup || null,
    changes: Number(d.changes) || 0
  };
}
function normalize(d) {
  return Object.assign({ clients: d.clients || [], children: d.children || [], shoots: d.shoots || [] }, metaOf(d));
}
function exportObj() {
  return Object.assign({ version: 1, clients: db.clients, children: db.children, shoots: db.shoots }, metaOf(db));
}

/* ---------- Čuvanje ---------- */
async function start() {
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    try { store = await c.use('db'); } catch (e) { store = null; }
    try { downloads = await c.use('downloads'); } catch (e) { downloads = null; }
  }
  if (!store) { startLocal(); return; }
  mode = 'cloud';
  let pending = 4;
  const firstDone = () => { if (--pending === 0) { loaded = true; render(); } };
  for (const key of Object.keys(COLS)) {
    let first = true;
    store.collection(COLS[key]).limit(1000).onSnapshot(snap => {
      const arr = [], m = {};
      for (const d of snap.docs) {
        if (!d.exists) continue;
        const o = Object.assign({}, d.data(), { id: d.id });
        arr.push(o); m[d.id] = JSON.stringify(o);
      }
      synced[key] = m; db[key] = arr;
      if (first) { first = false; firstDone(); } else if (loaded) render();
    }, onDbError);
  }
  let firstMeta = true;
  store.doc('meta/main').onSnapshot(s => {
    const m = metaOf(s.exists ? s.data() : {});
    synced.meta = JSON.stringify(m); Object.assign(db, m);
    if (firstMeta) { firstMeta = false; firstDone(); } else if (loaded) render();
  }, onDbError);
}
function startLocal() {
  mode = 'local';
  try { const s = localStorage.getItem(LOCAL_KEY); if (s) db = normalize(JSON.parse(s)); }
  catch (e) { writeError = 'Ovaj browser ne dozvoljava čuvanje podataka.'; }
  loaded = true; render();
}
function onDbError(e) {
  writeError = 'Veza sa bazom je prekinuta (' + (e && e.code || 'greška') + '). Osvježite stranicu.';
  renderStatus();
}
function writeDoc(path, body) {
  pendingWrites++; renderStatus();
  const run = attempt => {
    const ref = store.doc(path);
    return (body ? ref.set(body) : ref.delete()).catch(e => {
      if (e && e.code === 'unavailable' && attempt === 0) return new Promise(r => setTimeout(r, 800 + Math.random() * 800)).then(() => run(1));
      throw e;
    });
  };
  docChains[path] = (docChains[path] || Promise.resolve()).then(() => run(0))
    .catch(e => { writeError = 'Promjena nije sačuvana (' + (e && e.code || 'greška') + '). Osvježite stranicu i pokušajte ponovo.'; })
    .finally(() => { pendingWrites--; renderStatus(); });
}
function persist() {
  if (mode === 'local') {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(exportObj())); }
    catch (e) { writeError = 'Ovaj browser ne dozvoljava čuvanje podataka.'; }
    return;
  }
  if (mode !== 'cloud') return;
  for (const key of Object.keys(COLS)) {
    const cur = {};
    for (const r of db[key]) cur[r.id] = JSON.stringify(r);
    for (const id in cur) if (cur[id] !== synced[key][id]) { synced[key][id] = cur[id]; writeDoc(COLS[key] + '/' + id, JSON.parse(cur[id])); }
    for (const id of Object.keys(synced[key])) if (!(id in cur)) { delete synced[key][id]; writeDoc(COLS[key] + '/' + id, null); }
  }
  const m = JSON.stringify(metaOf(db));
  if (m !== synced.meta) { synced.meta = m; writeDoc('meta/main', JSON.parse(m)); }
}
function commit() { db.changes = (db.changes || 0) + 1; persist(); render(); }
function putRec(key, rec) {
  const i = db[key].findIndex(x => x.id === rec.id);
  if (i >= 0) db[key][i] = rec; else db[key].push(rec);
}

/* ---------- Pomoćne ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const chk = id => { const el = document.getElementById(id); return !!(el && el.checked); };
const radio = name => { const el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ''; };
const eur = n => (Math.round(n * 100) / 100).toLocaleString('sr-ME') + ' €';
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const nFoto = n => n + ' ' + plural(n, 'fotosesija', 'fotosesije', 'fotosesija');

function todayD() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); }
function fmt(s) {
  if (!s) return '';
  if (s.length === 10) return s.slice(8) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) + '.';
  if (s.length === 7) return '≈ ' + MJESECI[+s.slice(5) - 1] + ' ' + s.slice(0, 4) + '.';
  return '≈ ' + s + '.';
}
function validDate(y, m, d) { const x = new Date(y, m - 1, d); return x.getFullYear() === y && x.getMonth() === m - 1 && x.getDate() === d; }
// "16.06.2025" | "06.2025" | "2025" | "2025-06-16" → ISO (djelimični); '' = prazno; null = greška
function parseDob(str) {
  str = (str || '').trim().replace(/\.$/, '');
  if (!str) return '';
  let m;
  if ((m = str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/)) && validDate(+m[3], +m[2], +m[1]))
    return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  if ((m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/)) && validDate(+m[1], +m[2], +m[3])) return str;
  if ((m = str.match(/^(\d{1,2})[.\/-](\d{4})$/)) && +m[1] >= 1 && +m[1] <= 12) return m[2] + '-' + m[1].padStart(2, '0');
  if ((m = str.match(/^(\d{4})$/))) return str;
  return null;
}
const DOB_ERR = 'Datum rođenja: upišite kao 16.06.2025, ili samo mjesec 06.2025, ili godinu 2025.';
function dobInput(s) {
  if (!s) return '';
  if (s.length === 10) return s.slice(8) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4);
  if (s.length === 7) return s.slice(5) + '.' + s.slice(0, 4);
  return s;
}
function cleanIg(s) {
  return (s || '').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/[?#].*$/, '').replace(/\/+$/, '').replace(/^@/, '');
}
function toast(msg, isErr) {
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), isErr ? 4500 : 2200);
}
// potvrda unutar stranice (browser dijalozi ovdje ne rade)
function ask(msg, yesLabel, onYes) {
  $('#confirmMsg').textContent = msg;
  $('#confirmYes').textContent = yesLabel;
  $('#confirm').hidden = false;
  $('#confirmYes').focus();
  $('#confirmYes').onclick = () => { $('#confirm').hidden = true; onYes(); };
  $('#confirmNo').onclick = () => { $('#confirm').hidden = true; };
}

const clientById = id => db.clients.find(c => c.id === id);
const kidsOf = cid => db.children.filter(k => k.clientId === cid);
const shootsOf = cid => db.shoots.filter(s => s.clientId === cid);
const isRepeat = cid => shootsOf(cid).filter(s => s.status !== 'Otkazano').length >= 2;
const kidName = k => k.ime || '(ime nepoznato)';
const byName = (a, b) => (a.ime || '').localeCompare(b.ime || '', 'sr');
const hasIznos = s => !(s.iznos === '' || s.iznos == null);

function contactHtml(c) {
  const p = [];
  if (c.instagram) p.push('<a href="https://instagram.com/' + encodeURIComponent(c.instagram) + '" target="_blank" rel="noopener">@' + esc(c.instagram) + '</a>');
  if (c.telefon) {
    const m = [c.viber && 'Viber', c.whatsapp && 'WhatsApp'].filter(Boolean).join(', ');
    p.push(esc(c.telefon) + (m ? ' <span class="muted">(' + m + ')</span>' : ''));
  }
  if (c.telegram) p.push('Telegram ' + esc(c.telegram));
  return p.join('<br>') || '<span class="muted">—</span>';
}

function addWorkdays(isoS, n) {

  while (k < n) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) k++; }
  return iso(d);
}
function rokStart(s) { return s.vrsta === 'Događaj' ? s.datum : s.datumIzbora; }

  if (r < t) return -Math.round((t - r) / 864e5);

}

function bdayInfo(k, t) {
  const dob = k.dob;
  if (!dob || dob.length === 4) return null;
  const y = +dob.slice(0, 4), m = +dob.slice(5, 7), day = dob.length === 10 ? +dob.slice(8, 10) : 0;
  for (const Y of [t.getFullYear() - 1, t.getFullYear(), t.getFullYear() + 1]) {

    const start = new Date(Y, m - 1, day || 1);

    const winStart = new Date(start); winStart.setDate(winStart.getDate() - PODSJETNIK_DANA);
    if (t >= winStart && t <= end) {

    }
  }
  return null;
}

      ? 'Podaci se čuvaju u <b>privatnoj bazi ove stranice na claude.ai</b>. Vidite ih samo vi, kad ste prijavljeni na svoj nalog, sa bilo kog računara. Rezervna kopija je dodatna sigurnost: fajl koji čuvate kod sebe.'
      : 'Podaci se čuvaju <b>samo u ovom browseru na ovom računaru</b>. Ako obrišete podatke browsera, vraćaju se samo iz rezervne kopije.';
    return '<h1>Rezervna kopija</h1><p style="max-width:75ch">' + where + '</p>' +
      '<p>Posljednja kopija: <b>' + (db.lastBackup ? fmt(db.lastBackup.slice(0, 10)) : 'nikad') + '</b>. U bazi: ' + db.clients.length + ' klijentkinja, ' + db.children.length + ' djece, ' + nFoto(db.shoots.length) + '.</p>' +
      '<div class="toolbar"><button type="button" class="primary" data-act="backup">⬇ Sačuvaj rezervnu kopiju</button>' +

      '<p class="hint">Kopija je jedan .json fajl — čuvajte ga na USB-u ili u svom privatnom oblaku. Vraćanje iz kopije <b>zamjenjuje</b> sve trenutne podatke.</p>';
  }
};

/* ---------- Prozori ---------- */
function openModal(html) {
  const old = $('#modalBox'), box = old.cloneNode(false); // svjež element, bez starih listenera
  old.replaceWith(box);
  box.innerHTML = html;
  $('#modal').hidden = false;
  const f = box.querySelector('[autofocus]'); if (f) f.focus();
}
function closeModal() { $('#modal').hidden = true; $('#modalBox').innerHTML = ''; }
const chips = (name, arr, cur) => '<div class="chips">' + arr.map((x, i) => '<label><input type="radio" id="' + name + '_' + i + '" name="' + name + '" value="' + esc(x) + '"' + (x === cur ? ' checked' : '') + '><span>' + esc(x) + '</span></label>').join('') + '</div>';
const selectOpts = (arr, cur, blank) => (blank != null ? '<option value="">' + blank + '</option>' : '') + arr.map(x => '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
function projektSelect(id, cur) {
  const list = db.projekti.includes(cur) || !cur ? db.projekti : db.projekti.concat([cur]);
  return '<select id="' + id + '">' + selectOpts(list, cur, '— izaberite projekat —') + '<option value="__novi">+ novi projekat…</option></select>';
}
// "+ novi projekat" pretvara listu u polje za unos naziva
function wireProjekat(selId, wrapId, vrstaGetter) {
  const wrap = document.getElementById(wrapId);
  const upd = () => { wrap.hidden = vrstaGetter() !== 'Projekat'; };
  upd();
  $('#modalBox').addEventListener('change', e => {
    upd();
    const sel = e.target;
    if (sel.id !== selId || sel.value !== '__novi') return;
    sel.outerHTML = '<input id="' + selId + '" placeholder="Naziv novog projekta">';
    document.getElementById(selId).focus();
  });
}
function readProjekat(selId) {
  const p = val(selId);
  if (!p || p === '__novi') return '';
  if (!db.projekti.includes(p)) db.projekti.push(p);
  return p;
}

/* ---------- Kopija ---------- */
async function backup() {
  const data = JSON.stringify(exportObj(), null, 1);
  const filename = 'foto-crm-kopija-' + iso(new Date()) + '.json';
  if (downloads) {
    try { await downloads.save({ filename, data }); }
    catch (e) {
      if (e && e.code === 'declined') return;
      toast('Kopija nije sačuvana: ' + (e && e.message || 'greška'), true); return;
    }
  } else if (mode === 'local') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } else { toast('Preuzimanje fajla nije dostupno u ovom prikazu.', true); return; }
  db.lastBackup = new Date().toISOString(); db.changes = 0;
  persist(); render(); toast('Kopija sačuvana ✓');
}
function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (e) { toast('Fajl nije ispravan JSON.', true); return; }
    if (!d || !Array.isArray(d.clients) || !Array.isArray(d.shoots)) { toast('Ovo nije fajl Foto CRM-a.', true); return; }
    const msg = 'U fajlu: ' + d.clients.length + ' klijentkinja, ' + (d.children || []).length + ' djece, ' + nFoto(d.shoots.length) + '.' +
      (db.clients.length ? '\n\nPAŽNJA: trenutni podaci (' + db.clients.length + ' klijentkinja) biće ZAMIJENJENI.' : '');
    ask(msg, 'Vrati podatke', () => { db = normalize(d); persist(); tab = 'rodjendani'; render(); toast('Podaci učitani ✓'); });
  };
  r.readAsText(file);
}

/* ---------- Događaji ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]');
  if (!t || !loaded) return;
  if (t.dataset.tab) { tab = t.dataset.tab; ui.q = ''; render(); window.scrollTo(0, 0); return; }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'close': closeModal(); break;
    case 'client': openClient(id); break;
    case 'newClient': openClient(null); break;
    case 'shoot': openShoot(id); break;
    case 'newShoot': openShoot(null, id); break;
    case 'child': openChild(id); break;
    case 'newChild': openChild(null, id); break;
    case 'bdayDone': db.bdayDone = Object.assign({}, db.bdayDone, { [t.dataset.key]: iso(new Date()) }); commit(); break;
    case 'bdayUndo': { const b = Object.assign({}, db.bdayDone); delete b[t.dataset.key]; db.bdayDone = b; commit(); break; }
    case 'backup': backup(); break;
    case 'delClient': {
      const c = clientById(id); if (!c) return;
      ask('Obrisati klijentkinju „' + c.ime + '“ zajedno sa djecom (' + kidsOf(id).length + ') i fotosesijama (' + shootsOf(id).length + ')?', 'Obriši', () => {
        db.children = db.children.filter(k => k.clientId !== id); db.shoots = db.shoots.filter(s => s.clientId !== id); db.clients = db.clients.filter(x => x.id !== id);
        closeModal(); commit(); toast('Obrisano');
      });
      break;
    }
    case 'delChild': {
      const k = db.children.find(x => x.id === id); if (!k) return;
      ask('Obrisati dijete „' + kidName(k) + '“?', 'Obriši', () => {
        db.children = db.children.filter(x => x.id !== id);
        db.shoots = db.shoots.map(s => (s.childIds || []).includes(id) ? Object.assign({}, s, { childIds: s.childIds.filter(x => x !== id) }) : s);
        commit(); openClient(k.clientId);
      });
      break;
    }
    case 'delShoot': {
      const s = db.shoots.find(x => x.id === id); if (!s) return;
      ask('Obrisati ovu fotosesiju?', 'Obriši', () => { db.shoots = db.shoots.filter(x => x.id !== id); commit(); openClient(s.clientId); });
      break;
    }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; render(); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'fStatus' || id === 'fVrsta' || id === 'fGod') { ui[id] = e.target.value; render(); }
  if (id === 'statGod') { ui.statGod = e.target.value; render(); }
  if (id === 'importFile' && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#confirm').hidden) $('#confirm').hidden = true; else if (!$('#modal').hidden) closeModal(); return; }
  const open = !$('#modal').hidden || !$('#confirm').hidden;
  if (!open && loaded && (e.key === 'n' || e.key === 'N') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openQuick(); }
});
$('#btnNew').onclick = () => { if (loaded) openQuick(); };
window.addEventListener('storage', e => { if (mode === 'local' && e.key === LOCAL_KEY) { try { db = normalize(JSON.parse(e.newValue || '{}')); } catch (x) {} render(); } });
window.addEventListener('beforeunload', e => { if (pendingWrites) { e.preventDefault(); e.returnValue = ''; } });

start();
</script>
